<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f1f1f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Gang Muzik Studio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gm:theme");
          var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.setAttribute("data-theme", dark ? "dark" : "light");
          // keep in sync with APP_THEMES in src/theme/gangTheme.ts
          var swatch = { neutral: ["#f1f1f1", "#1b1b1b"], matcha: ["#f0f0e0", "#12140e"] };
          var p = "neutral";
          try { var v = JSON.parse(localStorage.getItem("gm:palette")); if (swatch[v]) p = v; } catch (e) {}
          root.setAttribute("data-astryx-theme", "gang-" + p);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", swatch[p][dark ? 1 : 0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
