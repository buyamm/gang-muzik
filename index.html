<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f1f1" />
    <meta name="description" content="Học và chơi saxophone, sáo trúc: tra thế bấm, luyện gam, sheet nhạc và cảm âm tự cuộn, lật trang bằng pedal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Gang Muzik</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gm:theme");
          var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.setAttribute("data-astryx-theme", "gang");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1b1b1b" : "#f1f1f1");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
